name: CI

on:
  pull_request:
    branches:
      - main

# Least-privilege GITHUB_TOKEN by default (mirrors MMC's convention) -- the
# `flaught` job below overrides this for itself only, to post PR comments.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # No test job yet -- added once `tester` produces a runnable suite
      # (CLAUDE.md: no test suite exists at scaffolding time).

  flaught:
    name: Adversarial review (Flaught)
    runs-on: ubuntu-latest
    # Scoped to just this job (mirrors MMC ADR 0020) -- the workflow-level
    # permissions block above stays contents: read. Only this job's
    # PR-comment step needs write access.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      # Pinned to an exact version (mirrors MMC ADR 0017) so a newly
      # published version can't start running in CI unreviewed.
      - name: Install Flaught
        run: npm install -g @flaught/core@0.8.1

      - name: Install Semgrep
        run: pip install semgrep

      # Unlike MMC, tktk's real toolchain (oxlint, npm audit) lives at the
      # repo root, same place `flaught review` runs from -- no
      # frontend/backend subdirectory install needed for auto-detection to
      # find it.
      - name: Install dependencies (for oxlint / npm audit)
        run: npm ci

      # Non-blocking: no step below ever exits 1. Findings surface via the
      # PR comment and the uploaded JSON artifact, not a merge gate. See
      # CLAUDE.md "CI adversarial review" before changing this.
      - name: Run adversarial review
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          flaught review \
            --base "origin/${PR_BASE_REF}" \
            --head HEAD \
            --output findings.json \
            --pr-description "${PR_TITLE}" \
            --quiet
        continue-on-error: true

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flaught-findings
          path: findings.json
          if-no-files-found: ignore

      # Re-runs --no-llm to render the comment body without a second LLM call
      # per PR (mirrors MMC's same tradeoff) -- the posted comment reflects
      # deterministic/test-inversion/scope-creep findings only; the uploaded
      # findings.json artifact is the source of truth for LLM findings.
      - name: Comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -f findings.json ]; then
            BODY=$(flaught review \
              --base "origin/${PR_BASE_REF}" \
              --head HEAD \
              --no-llm \
              --pr-description "${PR_TITLE}" \
              --quiet 2>/dev/null)
            echo "$BODY" | gh pr comment "${PR_NUMBER}" --body-file -
          fi
