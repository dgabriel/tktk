# Flaught adversarial review configuration
# See https://github.com/flaught/core for full documentation
#
# Left as Flaught's own generated defaults (`flaught init`) except three
# deviations, each called out below — see CLAUDE.md "CI adversarial review"
# for why hand-editing this file beyond necessity is deliberately avoided
# (a prior MMC incident traced real gaps back to piecemeal config drift,
# not the tool itself).

version: 1

# ── Stack declaration ──────────────────────────────────────
# Omit to auto-detect from repo contents (package.json, requirements.txt, etc.)
# stack:
#   languages: [python, typescript]
#   frameworks: [fastapi, react]
#   runtime: node  # node | python | mixed | auto

# ── LLM provider ───────────────────────────────────────────
llm:
  provider: groq            # openai | groq | gemini | anthropic | ollama
  model: groq/compound-mini # e.g. gpt-4o for openai, claude-sonnet-5 for anthropic
  api_key_env: GROQ_API_KEY # e.g. OPENAI_API_KEY for openai, ANTHROPIC_API_KEY for anthropic
  # base_url: null          # override for OpenAI-compatible endpoints, or an
                             # Anthropic Messages-API-compatible proxy/gateway
  temperature: 0.2
  max_tokens: 4096
  timeout_seconds: 120     # timeout for LLM API calls

# ── Deterministic tools ────────────────────────────────────
# Deviation 1: linter.command explicit. tktk uses oxlint, not the
# auto-detected eslint — left on auto-detect, this tool would silently find
# nothing and skip (same failure mode MMC's ADR 0020 hit with its
# frontend/backend toolchain layout).
tools:
  linter:
    enabled: true
    command: oxlint
# semgrep:
#   enabled: true
#   # config: path/to/semgrep-rules.yml
# vuln_scanner:
#   enabled: true
#   # command: npm audit  # override auto-detected scanner

# ── Test inversion ──────────────────────────────────────────
# test_inversion:
#   enabled: true
#   # command: pytest  # override auto-detected test command
#   scope_to_blast_radius: true  # only flag tests in the diff's changed/blast-radius files
#   skip_docs_only_diffs: true   # skip entirely when every changed file is documentation

# ── Scope-creep detection ─────────────────────────────────
# scope_creep:
#   enabled: true
#   intent_source: pr_description  # pr_description | linked_issue | both
#   # Paths that are never scored as scope creep (e.g. an ADR accompanying
#   # the change it documents), regardless of the PR's stated intent.
#   exclude_paths: []
#   #   - "docs/adr/**"

# ── Lighthouse (optional, degrades cleanly) ─────────────────
# lighthouse:
#   enabled: false
#   # preview_url: https://deploy-preview-42.example.com

# ── Noise budget ───────────────────────────────────────────
# noise_budget:
#   critical: 5
#   high: 10
#   medium: 15
#   low: 20
#   info: 25

# ── Severity gate ──────────────────────────────────────────
# Deviation 3: enabled (fail_on: high), matching the commented default's own
# suggested value. Needed for the local pre-commit gate (.husky/pre-commit)
# to actually block on real findings — the CI `flaught` job stays
# non-blocking regardless (CLAUDE.md "CI adversarial review"); this only
# governs the local hook's exit code.
severity_gate:
  fail_on: high  # none | critical | high | medium

# ── Dismissals ───────────────────────────────────────────────
# Findings matching an entry in the dismissal store (see `flaught dismiss`)
# are auto-marked dismissed on every subsequent run and excluded from the
# severity gate. Dismissing is a human call (CLAUDE.md) — an agent hitting a
# blocked commit reports the finding and stops, it doesn't dismiss it.
dismissals:
  enabled: true
  path: .flaught-dismissals.json

# ── Prompt templates ────────────────────────────────────────
# Override or extend the LLM prompts by dropping files into .flaught-prompt/
# See https://github.com/flaught/core for the full list of template files.
# prompt:
#   enabled: true
#   path: .flaught-prompt

# ── Exclusions ─────────────────────────────────────────────
# Deviation 2: exclude prototype/ from review context. It's a separate,
# unrelated React+Vite codebase (an earlier prototype, kept for reference
# only) — Flaught's dependency-graph context assembly scans the whole repo,
# not just the diff, so leaving this unexcluded would pull an unrelated
# stack into every MVP PR's review context.
exclude:
  paths:
    - "prototype/**"
    - "node_modules/**"
    - "vendor/**"
    - "**/*.min.js"
    - "**/*.min.css"
    - "**/*.generated.*"
  patterns: []
